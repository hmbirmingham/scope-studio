name: CI

on:
  # Every pull request, not just the ones targeting dev: work lands as stacked
  # branches, so a filter on the base branch leaves the whole stack untested
  # until the moment it merges.
  pull_request:
  push:
    branches: [dev]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: scope
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: scope_studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      # The embedding model is 274 MB and changes only when we change the tag.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-nomic-embed-text

      - name: Start Ollama and pull the embedding model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version > /dev/null && break
            sleep 1
          done
          ollama pull nomic-embed-text

      - run: npm ci
        working-directory: server

      - run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://scope@localhost:5432/scope_studio_test
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BASE_URL: http://localhost:3001

  control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scope
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: scope_control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: control/package-lock.json
      - run: npm ci
        working-directory: control
      - run: npm test
        working-directory: control
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://scope@localhost:5432/scope_control_test
          CONTROL_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx oxlint src/
        working-directory: client
      - run: npx vite build
        working-directory: client
